name: Build WhatsApp

on:
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='key.jks' >> gradle.properties
            echo "$KEY_STORE" | base64 --decode > key.jks
          elif [ -f "signing/waniultra.p12" ]; then
            openssl pkcs12 -in signing/waniultra.p12 -passin pass:waniultra -nodes -out /tmp/waniultra.pem
            openssl pkcs12 -export -in /tmp/waniultra.pem -out key.jks -name waniultra -passout pass:waniultra
            rm -f /tmp/waniultra.pem
            echo androidStorePassword=waniultra >> gradle.properties
            echo androidKeyAlias=waniultra >> gradle.properties
            echo androidKeyPassword=waniultra >> gradle.properties
            echo androidStoreFile=key.jks >> gradle.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build WhatsApp Release
        run: ./gradlew assembleWhatsappRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaEnhancer
          path: app/build/outputs/apk/whatsapp/release/WaEnhancer*.apk

      - name: Upload Proguard mapping
        uses: actions/upload-artifact@v4
        with:
          name: WaEnhancer-mapping
          path: app/build/outputs/mapping/whatsappRelease/mapping.txt
